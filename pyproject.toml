[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-collateral"
version = "0.1.0"
description = "SZL Holdings Series-A pitch collateral (PRIVATE, IP-sensitive) — one-pager, deck outline, demo scripts, design-partner outreach. Doctrine v11 LOCKED (749/14/163)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
dependencies = []

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/pitch-collateral"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
